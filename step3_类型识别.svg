<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="700" xmlns="http://www.w3.org/2000/svg">
  <style>
    .nav { fill: #2980b9; }
    .nav-text { font: bold 22px sans-serif; fill: #fff; }
    .title { font: bold 32px sans-serif; fill: #2c3e50; }
    .desc { font: 18px sans-serif; fill: #555; }
    .label { font: bold 20px sans-serif; fill: #2980b9; }
    .result { font: 20px sans-serif; fill: #27ae60; }
    .dropdown { fill: #fff; stroke: #2980b9; stroke-width: 2; rx: 8; }
    .dropdown-text { font: 18px sans-serif; fill: #555; }
    .button { fill: #2980b9; rx: 10; }
    .button-text { font: bold 20px sans-serif; fill: #fff; }
  </style>
  <!-- 顶部导航栏 -->
  <rect x="0" y="0" width="1200" height="60" class="nav"/>
  <text x="40" y="40" class="nav-text">AI法律服务平台</text>
  <text x="250" y="40" class="nav-text">首页</text>
  <text x="350" y="40" class="nav-text">合同审查</text>
  <text x="500" y="40" class="nav-text">法律检索</text>
  <text x="700" y="40" class="nav-text">个人中心</text>
  <!-- 页面标题 -->
  <text x="420" y="120" class="title">合同类型识别</text>
  <text x="420" y="160" class="desc">系统已自动识别合同类型，如有误可手动修改</text>
  <!-- 自动识别结果 -->
  <text x="420" y="220" class="label">自动识别结果：</text>
  <text x="600" y="220" class="result">买卖合同</text>
  <!-- 手动选择下拉菜单 -->
  <text x="420" y="280" class="label">手动选择类型：</text>
  <rect x="600" y="255" width="220" height="40" class="dropdown"/>
  <text x="620" y="283" class="dropdown-text">买卖合同 ▼</text>
  <!-- 下一步按钮 -->
  <rect x="520" y="350" width="160" height="50" class="button"/>
  <text x="570" y="385" class="button-text">下一步</text>
</svg> 
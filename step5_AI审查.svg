<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <style>
    .nav { fill: #2980b9; }
    .nav-text { font: bold 22px sans-serif; fill: #fff; }
    .title { font: bold 32px sans-serif; fill: #2c3e50; }
    .desc { font: 18px sans-serif; fill: #555; }
    .progress-bg { fill: #ddd; rx: 8; }
    .progress-bar { fill: #27ae60; rx: 8; }
    .card { fill: #ecf0f1; stroke: #2980b9; stroke-width: 2; rx: 16; }
    .card-title { font: bold 20px sans-serif; fill: #2980b9; }
    .card-content { font: 16px sans-serif; fill: #555; }
    .suggest { font: 16px sans-serif; fill: #27ae60; }
    .button { fill: #2980b9; rx: 8; }
    .button-text { font: bold 16px sans-serif; fill: #fff; }
    .hl-btn { fill: #fff; stroke: #2980b9; stroke-width: 2; rx: 6; }
    .hl-text { font: 16px sans-serif; fill: #2980b9; }
  </style>
  <!-- 顶部导航栏 -->
  <rect x="0" y="0" width="1200" height="60" class="nav"/>
  <text x="40" y="40" class="nav-text">AI法律服务平台</text>
  <text x="250" y="40" class="nav-text">首页</text>
  <text x="350" y="40" class="nav-text">合同审查</text>
  <text x="500" y="40" class="nav-text">法律检索</text>
  <text x="700" y="40" class="nav-text">个人中心</text>
  <!-- 页面标题 -->
  <text x="420" y="110" class="title">AI审查与风险报告</text>
  <text x="420" y="150" class="desc">AI正在分析合同内容，请稍候…</text>
  <!-- AI进度条 -->
  <rect x="350" y="180" width="500" height="20" class="progress-bg"/>
  <rect x="350" y="180" width="400" height="20" class="progress-bar"/>
  <text x="870" y="195" font-size="16" fill="#555">80%</text>
  <!-- 风险报告卡片1 -->
  <rect x="350" y="220" width="500" height="100" class="card"/>
  <text x="370" y="250" class="card-title">风险点1：合同金额填写不规范</text>
  <text x="370" y="280" class="card-content">原文：本合同金额为壹佰万元整。</text>
  <text x="370" y="305" class="suggest">建议：金额应同时标注阿拉伯数字与大写。</text>
  <rect x="800" y="260" width="90" height="30" class="hl-btn"/>
  <text x="815" y="282" class="hl-text">高亮原文</text>
  <!-- 风险报告卡片2 -->
  <rect x="350" y="340" width="500" height="100" class="card"/>
  <text x="370" y="370" class="card-title">风险点2：违约责任表述不清</text>
  <text x="370" y="400" class="card-content">原文：如有违约，双方协商解决。</text>
  <text x="370" y="425" class="suggest">建议：应明确违约责任及赔偿方式。</text>
  <rect x="800" y="380" width="90" height="30" class="hl-btn"/>
  <text x="815" y="402" class="hl-text">高亮原文</text>
</svg> 
<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="900" xmlns="http://www.w3.org/2000/svg">
  <style>
    .nav { fill: #2980b9; }
    .nav-text { font: bold 22px sans-serif; fill: #fff; }
    .title { font: bold 32px sans-serif; fill: #2c3e50; }
    .desc { font: 18px sans-serif; fill: #555; }
    .editor { fill: #fff; stroke: #2980b9; stroke-width: 2; rx: 16; }
    .toolbar { fill: #ecf0f1; stroke: #ccc; stroke-width: 1; }
    .ai-btn { fill: #27ae60; rx: 8; }
    .ai-btn-text { font: bold 16px sans-serif; fill: #fff; }
    .save-tip { font: 16px sans-serif; fill: #27ae60; }
    .diff-old { font: 16px sans-serif; fill: #e74c3c; text-decoration: line-through; }
    .diff-new { font: 16px sans-serif; fill: #27ae60; }
    .button { fill: #2980b9; rx: 8; }
    .button-text { font: bold 18px sans-serif; fill: #fff; }
  </style>
  <!-- 顶部导航栏 -->
  <rect x="0" y="0" width="1200" height="60" class="nav"/>
  <text x="40" y="40" class="nav-text">AI法律服务平台</text>
  <text x="250" y="40" class="nav-text">首页</text>
  <text x="350" y="40" class="nav-text">合同审查</text>
  <text x="500" y="40" class="nav-text">法律检索</text>
  <text x="700" y="40" class="nav-text">个人中心</text>
  <!-- 页面标题 -->
  <text x="420" y="110" class="title">在线修订合同</text>
  <text x="420" y="150" class="desc">可直接采纳AI建议，所有修订均有痕迹</text>
  <!-- 富文本编辑器 -->
  <rect x="200" y="180" width="800" height="500" class="editor"/>
  <!-- 工具栏 -->
  <rect x="200" y="180" width="800" height="40" class="toolbar"/>
  <rect x="220" y="190" width="120" height="24" class="ai-btn"/>
  <text x="240" y="208" class="ai-btn-text">一键采纳AI建议</text>
  <!-- 合同原文内容（示例） -->
  <text x="220" y="250" font-size="18" fill="#555">本合同金额为<tspan class="diff-old">壹佰万元整</tspan><tspan class="diff-new">￥1,000,000（壹佰万元整）</tspan>。</text>
  <text x="220" y="290" font-size="18" fill="#555">如有违约，<tspan class="diff-old">双方协商解决</tspan><tspan class="diff-new">违约方应赔偿守约方全部损失</tspan>。</text>
  <!-- 实时保存提示 -->
  <text x="900" y="710" class="save-tip">已自动保存</text>
  <!-- 返回风险报告按钮 -->
  <rect x="200" y="800" width="180" height="50" class="button"/>
  <text x="230" y="835" class="button-text">返回风险报告</text>
</svg> 
<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="700" xmlns="http://www.w3.org/2000/svg">
  <style>
    .nav { fill: #2980b9; }
    .nav-text { font: bold 22px sans-serif; fill: #fff; }
    .title { font: bold 32px sans-serif; fill: #2c3e50; }
    .desc { font: 18px sans-serif; fill: #555; }
    .upload { fill: #ecf0f1; stroke: #2980b9; stroke-width: 2; rx: 20; }
    .button { fill: #2980b9; rx: 10; }
    .button-text { font: bold 18px sans-serif; fill: #fff; }
    .list-title { font: bold 18px sans-serif; fill: #2980b9; }
    .list-item { font: 16px sans-serif; fill: #555; }
    .progress-bg { fill: #ddd; rx: 8; }
    .progress-bar { fill: #27ae60; rx: 8; }
  </style>
  <!-- 顶部导航栏 -->
  <rect x="0" y="0" width="1200" height="60" class="nav"/>
  <text x="40" y="40" class="nav-text">AI法律服务平台</text>
  <text x="250" y="40" class="nav-text">首页</text>
  <text x="350" y="40" class="nav-text">合同审查</text>
  <text x="500" y="40" class="nav-text">法律检索</text>
  <text x="700" y="40" class="nav-text">个人中心</text>
  <!-- 页面标题 -->
  <text x="420" y="110" class="title">上传合同</text>
  <text x="420" y="150" class="desc">支持PDF、Word、图片格式，最大50MB</text>
  <!-- 上传区 -->
  <rect x="350" y="180" width="500" height="120" class="upload"/>
  <text x="500" y="240" font-size="22" fill="#2980b9">拖拽或点击上传合同</text>
  <rect x="650" y="220" width="120" height="40" class="button"/>
  <text x="675" y="248" class="button-text">选择文件</text>
  <!-- 上传进度 -->
  <rect x="350" y="320" width="500" height="20" class="progress-bg"/>
  <rect x="350" y="320" width="300" height="20" class="progress-bar"/>
  <text x="870" y="335" font-size="16" fill="#555">60%</text>
  <!-- 历史上传列表 -->
  <text x="350" y="370" class="list-title">历史上传</text>
  <rect x="350" y="390" width="500" height="180" fill="#f8f8f8" stroke="#ccc" stroke-width="1" rx="12"/>
  <text x="370" y="420" class="list-item">2024-06-01 买卖合同.pdf</text>
  <text x="370" y="450" class="list-item">2024-05-28 劳务合同.docx</text>
  <text x="370" y="480" class="list-item">2024-05-20 租赁合同.jpg</text>
</svg> 